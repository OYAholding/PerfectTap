name: CI
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks (history + tree, repo config)
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.28.0/gitleaks_8.28.0_linux_x64.tar.gz | tar -xz gitleaks
          ./gitleaks git . --config .gitleaks.toml --redact --no-banner
          ./gitleaks dir . --config .gitleaks.toml --redact --no-banner

  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 2.119.0
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Start local Supabase (no cloud access)
        run: supabase start -x studio,imgproxy,vector,logflare,storage-api,supavisor
      - name: pgTAP
        run: supabase test db --local
      - name: End-to-end (local stack)
        run: ./supabase/tests/integration/run.sh

  ios-unit-tests:
    # Offline unit tests (consent flow, timing engine, duel settlement, codecs, legacy claim).
    # Free on public repos. No Apple credentials are used or needed.
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        working-directory: ios/PerfectTap
        run: xcodegen generate
      - name: Unit tests
        working-directory: ios/PerfectTap
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin)["devices"]; print(next(x["udid"] for r,l in d.items() if "iOS" in r for x in l if x["name"].startswith("iPhone")))')
          xcodebuild test -project PerfectTap.xcodeproj -scheme PerfectTap \
            -destination "platform=iOS Simulator,id=$UDID" \
            CODE_SIGNING_ALLOWED=NO -skipPackagePluginValidation | tail -40
          test ${PIPESTATUS[0]} -eq 0

name: PerfectTap
options:
  bundleIdPrefix: com.perfecttap
  # Settings below were previously set by hand in Xcode and are mirrored here
  # so `xcodegen generate` never drops them.
  deploymentTarget:
    iOS: "16.0"
  xcodeVersion: "15.0"
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: ""
    DEAD_CODE_STRIPPING: YES
    ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    STRING_CATALOG_GENERATE_SYMBOLS: YES

packages:
  GoogleMobileAds:
    url: https://github.com/googleads/swift-package-manager-google-mobile-ads
    from: "12.3.0"
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk
    from: "11.15.0"
  Supabase:
    url: https://github.com/supabase/supabase-swift
    exactVersion: "2.55.6"

targets:
  PerfectTap:
    type: application
    supportedDestinations: [iOS]
    sources:
      - path: .
        excludes:
          - project.yml
          - SETUP.md
          - PerfectTapUITests/**
          - PerfectTapTests/**
          - "*.xcodeproj"
          - "*.xcworkspace"
    dependencies:
      - package: GoogleMobileAds
      - package: Firebase
        product: FirebaseCore
      - package: Firebase
        product: FirebaseAuth
      - package: Firebase
        product: FirebaseFirestore
      - package: Firebase
        product: FirebaseAnalytics
      - package: Firebase
        product: FirebaseMessaging
      - package: Firebase
        product: FirebaseFunctions
      - package: Supabase
        product: Supabase
    settings:
      base:
        INFOPLIST_GENERATION_MODE: GeneratedFile
        PRODUCT_BUNDLE_IDENTIFIER: com.perfecttap.app
        PRODUCT_NAME: PerfectTap
        DEVELOPMENT_TEAM: K88C7DPG4C
        INFOPLIST_KEY_LSApplicationCategoryType: "public.app-category.arcade-games"
        MARKETING_VERSION: "1.0.2"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_CFBundleDisplayName: "Perfect Tap"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SWIFT_EMIT_LOC_STRINGS: YES
        CODE_SIGN_STYLE: Automatic
        # Public client config only (publishable key is safe to ship).
        # NEVER put a secret / service_role key in the app.
        SUPABASE_URL: ""   # set by scripts/use-supabase-project.sh <ref>
        SUPABASE_PUBLISHABLE_KEY: ""
      configs:
        # Backend switch (Backend.swift). Release stays on Firebase until cutover
        # (docs/SUPABASE_MIGRATION.he.md §cutover); flip to "supabase" to ship.
        Debug:
          PT_BACKEND: supabase
        Release:
          PT_BACKEND: firebase
    info:
      path: Info.plist
      properties:
        GADApplicationIdentifier: ca-app-pub-5350899688701342~1011431660
        PT_BACKEND: $(PT_BACKEND)
        SUPABASE_URL: $(SUPABASE_URL)
        SUPABASE_PUBLISHABLE_KEY: $(SUPABASE_PUBLISHABLE_KEY)
        SKAdNetworkItems:
          - SKAdNetworkIdentifier: cstr6suwn9.skadnetwork
          - SKAdNetworkIdentifier: 4fzdc2evr5.skadnetwork
          - SKAdNetworkIdentifier: 4pfyvq9l8r.skadnetwork
          - SKAdNetworkIdentifier: 2fnua5tdw4.skadnetwork

  PerfectTapTests:
    type: bundle.unit-test
    supportedDestinations: [iOS]
    platform: iOS
    sources:
      - path: PerfectTapTests
    dependencies:
      - target: PerfectTap
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.perfecttap.app.tests
        DEVELOPMENT_TEAM: K88C7DPG4C
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Automatic
        BUNDLE_LOADER: "$(TEST_HOST)"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/PerfectTap.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/PerfectTap"

  PerfectTapUITests:
    type: bundle.ui-testing
    supportedDestinations: [iOS]
    platform: iOS
    sources:
      - path: PerfectTapUITests
    dependencies:
      - target: PerfectTap
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.perfecttap.app.uitests
        DEVELOPMENT_TEAM: K88C7DPG4C
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Automatic

schemes:
  PerfectTap:
    build:
      targets:
        PerfectTap: all
    test:
      targets:
        - PerfectTapTests
